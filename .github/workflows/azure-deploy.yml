# Azure App Service Deployment with Sidecar Container
# Main app: Laravel (nginx + php-fpm + queue-worker)
# Sidecar: Laravel Reverb (WebSocket server)

name: Build and Deploy to Azure App Service

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: samakmasjid
  REGISTRY: ghcr.io
  IMAGE_NAME_APP: ${{ github.repository }}-app
  IMAGE_NAME_REVERB: ${{ github.repository }}-reverb

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for App image
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_APP }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push App image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/azure/Dockerfile.app
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Reverb image
        id: meta-reverb
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_REVERB }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Reverb image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/azure/Dockerfile.reverb
          push: true
          tags: ${{ steps.meta-reverb.outputs.tags }}
          labels: ${{ steps.meta-reverb.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy main container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_APP }}:latest

      - name: Configure App Service for container
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            # Set container configuration
            az webapp config container set \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group samakmasjid \
              --container-image-name ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_APP }}:latest \
              --container-registry-url https://${{ env.REGISTRY }}

            # Enable container logging
            az webapp log config \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group samak-masjid-rg \
              --docker-container-logging filesystem

            # Restart to apply changes
            az webapp restart \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group samak-masjid-rg

      - name: Output deployment info
        run: |
          echo "## Deployment Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Main App:** https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to Azure Portal → App Service → Deployment Center → Containers" >> $GITHUB_STEP_SUMMARY
          echo "2. Add sidecar container with image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME_REVERB }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Set port to 6001" >> $GITHUB_STEP_SUMMARY
